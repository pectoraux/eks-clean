# ============================================================================
#  Eks-Clean — CI/CD (GitHub Actions)
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eks
          POSTGRES_PASSWORD: eks
          POSTGRES_DB: eksclean_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Push schema to test DB
        env:
          DATABASE_URL: postgresql://eks:eks@localhost:5432/eksclean_test
        run: npx prisma db push --accept-data-loss
      - name: Seed test DB
        env:
          DATABASE_URL: postgresql://eks:eks@localhost:5432/eksclean_test
        run: npm run seed
      - name: Run tests (placeholder)
        run: echo "Tests TBD — see src/lib/**/*.test.ts"

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
